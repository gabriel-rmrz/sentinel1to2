# Parameter for the control of the workflow of the analysis pipeline

job:
  dir: 'jobs/job_test'

preprocessing:
  patch_dimension: [128,128]
  input_dir: "/lustrehome/garamire/share/agri2intesa/s1_to_s2/train/"
  do_norm_params: false
  path_params_file: "/lustrehome/garamire/share/agri2intesa/s1_to_s2/normalization_params.npz"
  sample_size: 6

data_loader:
  batch_size: 128
  n_workers: 0 

model:
  #name: "UNet"
  name: "SMP_UNet"
  parameters:
    encoder_name: "efficientnet-b0"
    encoder_weights: "imagenet"
    in_channels: 4
    classes: 9
training:
  train_dataset: "data/train_dataset_S2.h5"
  val_dataset: "data/val_dataset_S2.h5"
  output_dir: "data/output_combined/"
  model_output_path: "trained_models/best_model.pth" # Path to the output model file.
  optimizer: 
    name: "Adam"
    parameters:
      lr: 1e-4 # Learning rate
  loss:
    name: "CombinedLoss"
    parameters:
      alpha: 1.0
      beta: 2
      gamma: 0.1
inference:
  input_dir: "data/inference/"





