# Parameter for the control of the workflow of the analysis pipeline

job:
  dir: 'jobs/job_test'

preprocessing:
  patch_dimension: [128,128]
  input_dir: "/lustrehome/garamire/share/agri2intesa/s1_to_s2/train/"
  #input_dir: "/Users/garamire/Work/AgriIntesa/fromRoberto/share/agri2intesa/s1_to_s2/train"
  do_norm_params: false
  norm_params_file: "normalization_params.npz"
  precalc_norm_params_path: "/lustrehome/garamire/share/agri2intesa/s1_to_s2/normalization_params.npz"
  #precalc_norm_params_path: "/Users/garamire/Work/AgriIntesa/fromRoberto/share/agri2intesa/s1_to_s2/normalization_params.npz"
  sample_size: 6 # Use 0 to use all the scenes in the training input_dir


model:
  #name: "UNet"
  name: "SMP_UNet"
  parameters:
    encoder_name: "efficientnet-b0"
    encoder_weights: "imagenet"
    in_channels: 4
    #classes: 9 # This have to match the number of channels defined in the section target.
    #target: "s2"
training:
  model_output: "trained_model.pth" # Path to the output model file.
  data:
    train_dataset: "train_dataset_S2.h5"
    val_dataset: "val_dataset_S2.h5"
    batch_size: 64
    n_workers: 8
  n_epochs: 2 
  patience: 1
  optimizer: 
    name: "Adam"
    parameters:
      lr: 1e-4 # Learning rate
  gan:
    #mode: "none"        # "none" or "pix2pix"
    mode: "pix2pix"        # "none" or "pix2pix"
    lambda_recon: 100.0 # weight for reconstruction loss (L1/Combined/IndexStructure)
    lambda_adv: 1.0     # weight for adversarial loss
  ## Case for S2 bands
  #loss:
  #  name: "CombinedLoss"
  #  parameters:
  #    alpha: 1.0       # peso de L1
  #    beta: 2.0        # peso de SAM
  #    gamma: 0.1       # peso de VGG
  #    rgb_indices: [6, 2, 1]   # opcional, por defecto [6,2,1]

  # selected_indices: ["ndvi"]  # o ["ndvi", "gndvi", "ndwi", ...]
  loss:
    name: "CombinedLoss"
    parameters:
      alpha: 1.0          # L1
      beta: 1.0           # SAM
      gamma: 0.5          # peso del término estructural de índices
      num_scales: 3
      window_size: 11
      sigma: 1.5

