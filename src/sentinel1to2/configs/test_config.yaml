inference:
  #input_dir: "data/test"
  input_dir: "/lustrehome/garamire/share/agri2intesa/s1_to_s2/test" 
  #input_dir: "/lustrehome/garamire/Remote_sensing/sentinel1to2/src/sentinel1to2/data/test"
  output_dir: "output_combined/"
  sample_size: 6 # Use 0 to use all the scenes in the testing input_dir
evaluation:
  scenes_to_plot: 2

target:
  #type: "bands" # bands or indices. 
  type: "indices"
  all_bands: ["b1","blue", "green", "red", "b5", "rededge", "b7", "nir","b8a","b9", "b10", "swir", "b12"]
  selected_bands: [1,2,3,4,5,6,7,10,11]  # The number of elements of this list should match the number of output classes
  selected_indices: ["ndvi", "savi"]

performance:
  bands_metric_names: ["mae", "psnr", "ssim"] # TODO: Add sam here
  indices_metric_names: ["mae", "psnr", "ssim", "r2"] 

params:
  vegetation_indices: ["ndvi", "gndvi", "ndre", "reci", "msi", "ndwi", "evi", "savi", "arvi", "cig", "cire", "bsi", "ndsi", "mcari"]
